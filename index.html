    function isAndroid() { return /Android/i.test(navigator.userAgent); }
    function isIOS() { return /iPhone|iPad|iPod/i.test(navigator.userAgent); }

    function openWithAndroidIntent(url) {
      const fallback = encodeURIComponent(url);
      const urlNoScheme = url.replace(/^https?:\/\//i, '');
      const intentUri = 'intent://' + urlNoScheme +
        '#Intent;scheme=http;package=org.videolan.vlc;S.browser_fallback_url=' + fallback + ';end';
      window.location.href = intentUri;
    }

    function openWithiOSVLC(url) {
      const uri = 'vlc-x-callback://x-callback-url/stream?url=' + encodeURIComponent(url);
      window.location.href = uri;
    }

    function openDirect(url) { window.open(url, '_blank', 'noopener'); }

    const container = document.getElementById('container');

    categorias.forEach(cat => {
      const titulo = document.createElement('h2');
      titulo.textContent = cat.nombre;
      container.appendChild(titulo);

      const grid = document.createElement('div');
      grid.className = 'category-grid';
      container.appendChild(grid);

      cat.canales.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-nombre', ch.nombre.toLowerCase());

        card.innerHTML = `
          <img src="${ch.logo}" alt="logo">
          <strong>${ch.nombre}</strong>
          <div class="actions">
            <button class="btn-android">📱 Android</button>
            <button class="btn-ios">🍎 iOS</button>
            <button class="btn-direct">🌐 Web</button>
          </div>
        `;

        card.querySelector('.btn-android').addEventListener('click', () => {
          if (isAndroid()) openWithAndroidIntent(ch.url);
          else alert('Solo para Android');
        });
        card.querySelector('.btn-ios').addEventListener('click', () => {
          if (isIOS()) openWithiOSVLC(ch.url);
          else alert('Solo para iPhone/iPad');
        });
        card.querySelector('.btn-direct').addEventListener('click', () => openDirect(ch.url));

        grid.appendChild(card);
      });
    });

    const searchInput = document.getElementById('search');
    const noResults = document.querySelector('.no-results');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      const cards = document.querySelectorAll('.card');
      let visible = 0;

      cards.forEach(card => {
        const name = card.getAttribute('data-nombre');
        if (name.includes(query)) {
          card.style.display = 'flex';
          visible++;
        } else { card.style.display = 'none'; }
      });

      noResults.style.display = visible === 0 ? 'block' : 'none';
    });
